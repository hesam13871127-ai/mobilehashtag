<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="موبایل هشتگ؛ فروشگاه نمایشی گوشی هوشمند، لوازم جانبی و گجت با تجربه خرید فارسی."
    />
    <meta name="theme-color" content="#c9a44c" />
    <title>ساخت حساب کاربری | موبایل هشتگ</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link
      rel="preload"
      href="/assets/fonts/vazirmatn-arabic-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script type="module" src="/assets/js/pages.js"></script>
  </head>
  <body data-page="register">
    <a class="skip-link" href="#main">رفتن به محتوای اصلی</a>
    <header id="site-header"></header>
    <main id="main">
      <div class="auth-layout container">
        <div class="auth-story">
          <img src="assets/images/brand/symbol.svg" alt="نشان هشتگ" /><span class="overline"
            >یک شروع هوشمندانه</span
          >
          <h1>به خانواده<br />هشتگ بپیوندید.</h1>
          <p>انتخاب‌های شما را به خاطر می‌سپاریم؛<br />برای تجربه‌ای شخصی‌تر و ساده‌تر.</p>
        </div>
        <section class="auth-panel">
          <span class="overline">فقط چند قدم کوتاه</span>
          <h2>ساخت حساب کاربری</h2>
          <form id="register-form" class="form-stack">
            <label
              >نام و نام خانوادگی<input
                name="name"
                required
                minlength="2"
                maxlength="100"
                autocomplete="name" /></label
            ><label
              >ایمیل<input
                name="email"
                type="email"
                required
                autocomplete="email"
                dir="ltr"
                placeholder="you@example.com" /></label
            ><label
              >رمز عبور<input
                name="password"
                type="password"
                required
                minlength="10"
                maxlength="128"
                autocomplete="new-password"
              /><small>حداقل ۱۰ کاراکتر؛ از رمز شخصی خود استفاده نکنید.</small></label
            ><label class="check-label"
              ><input type="checkbox" required />
              <span
                ><a href="terms.html">قوانین</a> و <a href="privacy.html">حریم خصوصی</a> را
                می‌پذیرم.</span
              ></label
            >
            <p class="form-error" role="alert"></p>
            <button class="button dark full">
              ایجاد حساب کاربری
              <svg
                class="inline-arrow"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 12H4m6-6-6 6 6 6" />
              </svg>
            </button>
          </form>
          <p class="auth-switch">قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">وارد شوید</a></p>
        </section>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <div id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog id="app-dialog"></dialog>
    <noscript><p>برای استفاده از امکانات فروشگاه، جاوااسکریپت مرورگر را فعال کنید.</p></noscript>
  </body>
</html>
