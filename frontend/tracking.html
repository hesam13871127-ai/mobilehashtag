<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="موبایل هشتگ؛ فروشگاه نمایشی گوشی هوشمند، لوازم جانبی و گجت با تجربه خرید فارسی."
    />
    <meta name="theme-color" content="#c9a44c" />
    <title>پیگیری سفارش | موبایل هشتگ</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link
      rel="preload"
      href="/assets/fonts/vazirmatn-arabic-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script type="module" src="/assets/js/pages.js"></script>
  </head>
  <body data-page="tracking">
    <a class="skip-link" href="#main">رفتن به محتوای اصلی</a>
    <header id="site-header"></header>
    <main id="main">
      <div class="container page-space narrow">
        <div class="page-heading centered">
          <span class="overline">از انتخاب تا همراهی</span>
          <h1>پیگیری سفارش</h1>
          <p>کد پیگیری و شماره موبایل گیرنده را وارد کنید.</p>
        </div>
        <form id="tracking-form" class="panel form-stack">
          <label
            >کد پیگیری<input
              name="code"
              required
              dir="ltr"
              placeholder="MH-…"
              maxlength="40" /></label
          ><label
            >شماره موبایل<input
              name="phone"
              type="tel"
              required
              dir="ltr"
              placeholder="09xxxxxxxxx"
          /></label>
          <p class="form-error" role="alert"></p>
          <button class="button dark">
            بررسی سفارش
            <svg
              class="inline-arrow"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 12H4m6-6-6 6 6 6" />
            </svg>
          </button>
        </form>
        <div id="tracking-result"></div>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <div id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog id="app-dialog"></dialog>
    <noscript><p>برای استفاده از امکانات فروشگاه، جاوااسکریپت مرورگر را فعال کنید.</p></noscript>
  </body>
</html>
